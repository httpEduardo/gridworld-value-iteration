<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolicyFabric</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Value iteration</p>
        <h1>PolicyFabric</h1>
        <p>Compute state values on a grid world.</p>
      </header>
      <section class="panel">
        <textarea id="gridInput" rows="6">0,0,1
0,-1,0
0,0,0
0,X,0</textarea>
        <div class="grid">
          <label>Gamma <input id="gammaInput" type="number" step="0.05" value="0.9" /></label>
          <label>Iterations <input id="iterInput" type="number" value="20" /></label>
        </div>
        <button id="iterateButton">Iterate</button>
      </section>
      <section class="panel">
        <h2>Values</h2>
        <pre id="output"></pre>
      </section>
    </main>
    <div class="fabric"></div>
    <script src="app.js"></script>
  </body>
</html>
